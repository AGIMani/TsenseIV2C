controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
hand_controller:
  ros__parameters:
    joints:
    - right_hand_thumb_rota_block_joint
    - right_hand_thumb_rotaback_joint2
    - right_hand_thumb_MCP_joint
    - right_hand_thumb_PIP_joint
    - right_hand_index_MCP_joint
    - right_hand_index_swing_joint
    - right_hand_index_PIP_joint
    - right_hand_index_DIP_joint
    - right_hand_mid_MCP_joint
    - right_hand_mid_swing_joint
    - right_hand_mid_PIP_joint
    - right_hand_mid_DIP_joint
    - right_hand_ring_MCP_joint
    - right_hand_ring_swing_joint
    - right_hand_ring_PIP_joint
    - right_hand_ring_DIP_joint
    - right_hand_pinky_MCP_joint
    - right_hand_pinky_swing_joint
    - right_hand_pinky_PIP_joint
    - right_hand_pinky_DIP_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
