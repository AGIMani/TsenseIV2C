schema_version: 1
model_id: TsenseI_v3_2_withid
display_name: TsenseI A3.2 with ID
coordinate_space: urdf_radians
sides:
  left:
    urdf: urdf/TsenseI_hand_left_v3_2_withid.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
  right:
    urdf: urdf/TsenseI_hand_right_v3_2_withid.urdf
    keypoints: robot_keypoints_21_right.yaml
    eval_config: eval_config_right.yaml
    mjcf: mjcf/mjmodel_right.xml
fixed_joints: {}
hardware:
  enabled: false
  adapter: a32_native_sdk
  supported_sides:
  - left
  - right
retarget:
  pinch_enabled: true
  pinch_full_ratio: 0.15
  pinch_index_full_ratio: 0.15
  pinch_start_ratio: 0.5
  pinch_weight: 65.0
  pinch_index_weight: 65.0
  lambda_smooth: 0.1
  lambda_reg: 0.1
  init_max_iters: 2
  topo_max_iters: 3
mirror_axis: y
right_hand_provisional: false
collision_scope: different_fingers_only
notes:
- Both hands supplied by the 2026-11-16 shell package; mesh bytes, inertias, joint
  origins, axes and limits retained.
- Base coordinates use the supplied wrist mounting hole; no extra mirror or root rotation
  applied.
- Only the two active runtime URDFs are retained; source provenance is recorded as
  metadata and hashes.
- Stable application names alias the supplied semantic names; thumb IP uses the historical
  thumb_PIP channel.
- The palm frame is a massless identity alias of the supplied base.
- Keypoints regenerated per side from joint centres and surface caps; physical calibration
  remains pending.
- Collision envelopes rebuilt; different-finger-only collision policy retained.
mirror_plane_offset_m: 0.0
cad_version: customer-shell-20261116
