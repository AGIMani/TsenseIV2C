schema_version: 1
model_id: TsenseI_v3_2_withid
display_name: TsenseI A3.2 with ID
coordinate_space: urdf_radians
sides:
  left:
    urdf: urdf/TsenseI_hand_left_v3_2_withid.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
  right:
    urdf: urdf/TsenseI_hand_right_v3_2_withid.urdf
    keypoints: robot_keypoints_21_right.yaml
    eval_config: eval_config_right.yaml
    mjcf: mjcf/mjmodel_right.xml
fixed_joints: {}
hardware:
  enabled: false
  adapter: a32_native_sdk
  supported_sides:
  - left
  - right
retarget:
  pinch_enabled: true
  pinch_full_ratio: 0.15
  pinch_index_full_ratio: 0.15
  pinch_start_ratio: 0.5
  pinch_weight: 65.0
  pinch_index_weight: 65.0
  lambda_smooth: 0.1
  lambda_reg: 0.1
  init_max_iters: 2
  topo_max_iters: 3
mirror_axis: y
right_hand_provisional: true
collision_scope: different_fingers_only
notes:
- 20-output middle-DIP CAD imported with source joint frames, limits and metre meshes.
- Right generated by XZ reflection; axial vectors use -M so equal q produces mirrored
  poses.
- Keypoints reprojected from previous zero pose; manual recalibration pending.
- Collision envelopes rebuilt from new meshes; source has no identified mass or inertia.
- A3.2 SDK 1.1.15 and left/right hardware slot mapping retained.
