schema_version: 1
model_id: TsenseI_v3_2_withid
display_name: TsenseI A3.2 with ID
coordinate_space: urdf_radians
sides:
  left:
    urdf: urdf/TsenseI_hand_left_v3_2_withid.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
  right:
    urdf: urdf/TsenseI_hand_right_v3_2_withid.urdf
    keypoints: robot_keypoints_21_right.yaml
    eval_config: eval_config_right.yaml
    mjcf: mjcf/mjmodel_right.xml
fixed_joints: {}
hardware:
  enabled: false
  adapter: a32_native_sdk
  supported_sides:
  - left
  - right
retarget:
  pinch_enabled: true
  pinch_full_ratio: 0.15
  pinch_index_full_ratio: 0.15
  pinch_start_ratio: 0.5
  pinch_weight: 65.0
  pinch_index_weight: 65.0
  lambda_smooth: 0.1
  lambda_reg: 0.1
  init_max_iters: 2
  topo_max_iters: 3
mirror_axis: y
right_hand_provisional: true
collision_scope: different_fingers_only
notes:
- 2026-11-16 supplied left exterior CAD; all source visual meshes, inertias, joint
  origins, axes and limits retained.
- Right hand is an exact Y=0 geometric mirror; equal named angles produce mirrored
  poses.
- Right STL winding/normals, joint axial vectors, mass centres and inertia tensors
  reflected together.
- Stable application names alias the new semantic names; thumb IP is the historical
  thumb_PIP channel.
- The palm frame is an identity alias of the supplied base; it adds no duplicate mass
  or visual.
- Keypoints regenerated from source joint centres and surface caps; physical calibration
  remains unreviewed.
- Collision envelopes rebuilt from the new exterior; different-finger-only collision
  policy retained.
mirror_plane_offset_m: 0.0
cad_version: customer-exterior-20261116
