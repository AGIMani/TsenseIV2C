schema_version: 1
model_id: TsenseI_v3_2
display_name: TsenseI_V3.2
coordinate_space: urdf_radians
sides:
  left:
    urdf: urdf/TsenseI_hand_left_v3_2.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
  right:
    urdf: urdf/TsenseI_hand_right_v3_2.urdf
    keypoints: robot_keypoints_21_right.yaml
    eval_config: eval_config_right.yaml
    mjcf: mjcf/mjmodel_right.xml
fixed_joints: {}
# Previous-pose priors in BOTH stages otherwise accumulate ~1 s of lag at 15 Hz.
# Keep landmark smoothing, graph stabilization and all URDF limits enabled.
retarget:
  pinch_enabled: true
  pinch_full_ratio: 0.25
  pinch_start_ratio: 0.50
  pinch_weight: 65.0
  lambda_smooth: 0.1
  lambda_reg: 0.1
  init_max_iters: 2
  topo_max_iters: 3
hardware:
  enabled: false
  adapter: null
mirror_axis: x
notes:
- Pinky joint names follow function; link and mesh names retain their original chain labels.
- 'Pinky MCP: flexion 0..1.57; swing: lateral -0.35..0.35. CAD axes, origins and limits are preserved.'
- Keypoints are draft until manually calibrated; collision proxies are geometric approximations.
