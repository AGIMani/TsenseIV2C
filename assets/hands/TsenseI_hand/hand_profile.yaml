schema_version: 1
model_id: TsenseI_v2
display_name: TsenseI_V2
coordinate_space: urdf_radians
sides:
  left:
    urdf: urdf/TsenseI__hand_left_v1.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
  right:
    urdf: urdf/TsenseI__hand_right_v1.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
    solver_side: left
    collision_side: left
fixed_joints:
  left_hand_pinky_rota_joint: 0.0
retarget:
  pinch_enabled: true
  pinch_full_ratio: 0.15
  pinch_index_full_ratio: 0.15
  pinch_start_ratio: 0.50
  pinch_weight: 65.0
  pinch_index_weight: 65.0
  # Keep small historical priors: strong priors plus collision feedback cause
  # slow fist-to-open response. Desktop Form3 defaults use the same values.
  lambda_smooth: 0.1
  lambda_reg: 0.1
  init_max_iters: 2
  topo_max_iters: 3
hardware:
  enabled: false
  adapter: null
