schema_version: 1
model_id: TsenseI_v3_2_withid
display_name: TsenseI A3.2 with ID
coordinate_space: urdf_radians
sides:
  left:
    urdf: urdf/TsenseI_hand_left_v3_2_withid.urdf
    keypoints: robot_keypoints_21.yaml
    eval_config: eval_config.yaml
    mjcf: mjcf/mjmodel.xml
  right:
    urdf: urdf/TsenseI_hand_right_v3_2_withid.urdf
    keypoints: robot_keypoints_21_right.yaml
    eval_config: eval_config_right.yaml
    mjcf: mjcf/mjmodel_right.xml
fixed_joints: {}
hardware:
  enabled: false
  adapter: a32_native_sdk
  supported_sides:
  - left
retarget:
  pinch_enabled: true
  pinch_full_ratio: 0.08
  pinch_start_ratio: 0.5
  pinch_weight: 65.0
  lambda_smooth: 0.1
  lambda_reg: 0.1
  init_max_iters: 2
  topo_max_iters: 3
mirror_axis: y
right_hand_provisional: true
collision_scope: different_fingers_only
notes:
- Independent uploaded ID-shell URDF, meshes, landmarks and collision geometry.
- Base STL scale and link geometry retained; swing origin/axis transformed for new coordinates.
- 'PIP/DIP: 0.005..1.565; MCP: 0.005..1.3; swing model: 0..0.7 rad, default 0; command: 0.005..0.695 rad. New swing = -old swing + 0.350.'
- Both variants command the positive model swing directly after clipping; no second ID reversal.
- Right is the supplied provisional XZ mirror; hardware connection supports left only.
- 21 point annotations and collision capsules require hardware calibration.
