<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leap Motion 2 相机 · MediaPipe</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101c24;color:#e3eff5;font:15px/1.6 system-ui,sans-serif}
    main{max-width:880px;margin:32px auto;padding:0 24px}h1{font-size:25px;margin:8px 0}p{color:#a8bdc8}
    a{color:#72dfd4}button{padding:10px 18px;border:0;border-radius:8px;background:#6de2cd;color:#10332f;font:inherit;cursor:pointer}
    button:disabled{opacity:.4;cursor:default}#stop{background:#cedde5}nav{display:flex;align-items:center;gap:12px;margin:22px 0}
    #stage{position:relative;width:100%;aspect-ratio:1;background:#071117;border:1px solid #30424e;border-radius:14px;overflow:hidden}
    canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#image{transform:scaleX(-1)}
    #state{font-size:18px;color:#85ead8;display:block;margin:16px 0 8px}#hands{margin:8px 0}#notice{color:#ffce84;white-space:pre-wrap}
  </style>
</head>
<body><main>
  <a href="/?source=leapmotion_camera">← 手势跟踪工作台</a>
  <h1>Leap Motion 2 相机 · MediaPipe</h1>
  <p>通过 USB 3 采集左侧红外画面，目标 120 fps。MediaPipe 识别速度单独测量；三维关键点来自模型估计。</p>
  <nav><button id="start">开始相机识别</button><button id="stop" disabled>停止</button><span id="delegate">等待初始化</span></nav>
  <output id="state" role="status">相机未启动</output>
  <div id="hands">等待手部画面</div><div id="notice" role="status"></div>
  <div id="stage"><canvas id="image" width="512" height="512" aria-label="Leap 红外画面"></canvas><canvas id="overlay" aria-label="MediaPipe 21 点识别结果"></canvas></div>
  <script type="module" src="/leap-camera-preview.js"></script>
</main></body></html>
