<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#10201c">
  <title>Quest 3 手部采集 · TsenseI</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #10201c; color: #edf7f2; }
    body { margin: 0; padding: 28px 20px; }
    main { max-width: 780px; margin: auto; }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #bdd0c8; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; }
    input, select, button { font: inherit; padding: 14px; border-radius: 10px; }
    input, select { box-sizing: border-box; width: 100%; border: 1px solid #59776b; background: #183128; color: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0; }
    button { border: 0; background: #82e6b8; color: #10241b; font-weight: 650; min-width: 160px; cursor: pointer; }
    button.secondary { background: #355447; color: #effff7; }
    button:disabled { opacity: .5; cursor: default; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #355447; border-radius: 12px; padding: 18px; line-height: 1.6; background: #0b1813; }
    .hint { font-size: .9rem; }
    a { color: #82e6b8; }
    canvas { display: none; }
  </style>
</head>
<body>
  <main id="overlay-root">
    <h1 id="capture-title">Quest 3 手部采集</h1>
    <p id="capture-description">将头显的原生 25 个手部关节发送到在线控制页。进入 XR 后放下控制器，让双手保持在头显视野内；桌面页负责手型映射、预览和机械手控制。</p>
    <p class="hint">固定配对码 123456，永久有效。收藏本页，下次自动连接；请先在电脑选择 Quest 输入并开始识别。</p>
    <label for="pair-token">固定配对码</label>
    <input id="pair-token" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" spellcheck="false" value="123456" readonly>
    <button id="pair-connect" class="secondary" type="button">连接电脑</button>
    <label for="session-mode">显示模式</label>
    <select id="session-mode">
      <option value="immersive-ar">透视 AR（推荐）</option>
      <option value="immersive-vr">沉浸 VR</option>
    </select>
    <div class="actions">
      <button id="start">进入 XR 并开始采集</button>
      <button id="stop" class="secondary" disabled>停止采集</button>
    </div>
    <pre id="status" role="status" aria-live="polite">正在检查 WebXR…</pre>
    <p id="capture-connection-hint" class="hint">请使用 Quest Browser 打开可访问的 HTTPS 地址，并启用系统手部追踪。如果当前模式无法启动，请切换模式后再次点击进入。退出 XR、追踪丢失或网络过期时，桌面页会停止使用旧姿态。</p>
    <p class="hint"><a href="/">返回在线控制页</a></p>
    <canvas id="xr-canvas"></canvas>
  </main>
  <script type="module" src="/quest-capture.js"></script>
</body>
</html>
